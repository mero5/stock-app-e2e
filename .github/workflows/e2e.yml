# ===================================================
# E2Eテストの自動実行（GitHub Actions）
#
# 動くタイミング：
#   ・main への push / PR の作成・更新
#   ・平日の朝 9:00（日本時間）… 本番のAPIが壊れていないかの定期チェック
#   ・手動（Actions 画面の「Run workflow」）… AIテストも回すかを選べる
#   ・stock_app のデプロイ後（repository_dispatch: stock-app-deployed）
#
# テスト結果は、Actions の実行結果ページの先頭（Summary）に機能ごとの○×の表で出る。
# 詳しいレポート（HTML・失敗時のスクリーンショット）は同じページの「Artifacts」に残る。
# ===================================================
name: E2E

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 1-5"   # UTC 0:00 = 日本時間 9:00（月〜金）
  workflow_dispatch:
    inputs:
      run_ai:
        description: "AIを呼ぶテストも実行する（OpenAIの料金がかかる）"
        type: boolean
        default: false
      app_ref:
        description: "画面テストでビルドする stock_app のブランチ・タグ・コミット（PRの確認用）"
        type: string
        default: main
  repository_dispatch:
    types: [stock-app-deployed]

jobs:
  api-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存ライブラリのインストール
        run: pip install -r requirements.txt

      # APIのテストはブラウザを使わないので playwright install は不要
      - name: E2Eテスト（API）
        env:
          # リポジトリの Settings → Variables で上書きできる（未設定なら本番）
          STOCK_API_URL: ${{ vars.STOCK_API_URL }}
          RUN_AI_TESTS: ${{ github.event.inputs.run_ai == 'true' && '1' || '0' }}
          E2E_RESULTS: reports/results-api.json
        run: >
          pytest tests/api -rxXs
          --html=reports/report.html --self-contained-html
          --junitxml=reports/junit.xml

      # 実行結果ページの先頭に、機能ごとの○×の表を出す（失敗しても必ず出す）
      - name: 結果の一覧（○×）を表示
        if: always()
        run: python scripts/summary.py reports/results-api.json "APIテスト"

      - name: レポートを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: reports/
          retention-days: 30

  # ===================================================
  # 画面テスト：stock_app を Flutter Web でビルドして Playwright で操作する
  # ===================================================
  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: stock_app を取得
        uses: actions/checkout@v4
        with:
          repository: mero5/stock_app
          ref: ${{ github.event.inputs.app_ref || github.event.client_payload.ref || 'main' }}
          path: app

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2   # 開発環境と同じバージョン
          cache: true

      - name: Web版をビルド
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release

      - name: Web版を配信（バックグラウンド）
        run: python -m http.server 8765 --bind 127.0.0.1 --directory app/build/web &

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存ライブラリとブラウザのインストール
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 画面テスト
        env:
          STOCK_APP_WEB_URL: http://127.0.0.1:8765/
          # テスト専用アカウント（Settings → Secrets and variables → Actions に登録）
          # 未登録ならログインが必要なテストはスキップされる
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_RESULTS: reports/results-ui.json
        run: >
          pytest tests/ui -rxXs
          --screenshot only-on-failure --tracing retain-on-failure --output test-results
          --html=reports/ui-report.html --self-contained-html

      - name: 結果の一覧（○×）を表示
        if: always()
        env:
          APP_REF: ${{ github.event.inputs.app_ref || github.event.client_payload.ref || 'main' }}
        run: python scripts/summary.py reports/results-ui.json "画面テスト（stock_app の $APP_REF をビルド）"

      - name: レポート・失敗時のスクリーンショットを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-report
          path: |
            reports/
            test-results/
          retention-days: 30
